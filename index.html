<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポーズジェネレーター</title>
<style>
:root{--bg:#f1efea;--fg:#222;--pn:#fff;--bd:#d6d2c8;--ac:#2b6cb0}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c1f;--fg:#e8e8e8;--pn:#26282c;--bd:#3a3d43;--ac:#6aa8ff}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--fg);display:flex;gap:16px;padding:16px;height:100vh;overflow:hidden;align-items:stretch}
#side{flex:0 0 300px;width:300px;overflow-y:auto;max-height:100%;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
#side>*{flex-shrink:0}
#main{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;overflow:auto}
@media(max-width:720px){body{flex-direction:column;height:auto;overflow:auto}#main{position:sticky;top:0;z-index:5;background:var(--bg);order:-1}#side{flex:none;width:100%;max-height:none;overflow:visible}canvas{max-height:48vh}}
canvas{max-width:100%;max-height:calc(100vh - 32px);height:auto;background:#fff;border:1px solid var(--bd);box-shadow:0 2px 12px #0002}
h1{font-size:16px;margin:0}
button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button:hover{filter:brightness(1.08)}
.row{display:flex;gap:6px}.row>*{flex:1}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
label.c{justify-content:flex-start}
select,input[type=text],input[type=number]{font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);min-width:0}
input[type=range]{width:150px}
hr{border:0;border-top:1px solid var(--bd);width:100%;margin:2px 0}
small{opacity:.65}
</style></head><body>
<div id="side">
<h1>ポーズジェネレーター</h1>
<button class="p" id="gen">🎲 全部ランダム生成 (Space)</button>
<div class="row"><button id="gp">ポーズだけ (P)</button><button id="gc">カメラだけ (C)</button></div>
<button id="save">💾 PNGで保存 (S)</button>
<hr>
<label>シーン<select id="scn"><option value="auto">おまかせ(1〜10人)</option></select></label>
<label>ポーズ種類(1人用)<select id="ptype"><option value="random">おまかせ</option></select></label>
<label>アタリの種類<select id="style"><option value="volume">円柱・球(ボリューム)</option><option value="joint">関節ボール(デッサン人形)</option><option value="box">箱型(ブロック)</option><option value="stick">棒人間</option><option value="silhouette">シルエット(塊)</option><option value="gesture">ジェスチャー(動勢線)</option></select></label>
<label>キャンバス<select id="asp"><option>3:4</option><option>4:3</option><option>1:1</option><option>9:16</option><option>16:9</option><option value="custom">カスタム(px指定)</option></select></label>
<label>サイズ(px) 幅×高さ<span class="row" style="flex:0 0 170px;align-items:center"><input type="number" id="cw" min="200" max="4000" style="width:72px">×<input type="number" id="chh" min="200" max="4000" style="width:72px"></span></label>
<label>構図<select id="comp"><option value="auto">自動</option><option value="third">三分割</option><option value="golden">黄金比</option><option value="center">中央</option><option value="diag">対角線</option></select></label>
<label>ショット(1人のみ)<select id="shot"><option value="auto">自動</option><option value="full">全身</option><option value="knee">ひざ上</option><option value="bust">バスト</option></select></label>
<label>線の色<select id="col"><option value="#3b6cb0">青</option><option value="#c0392b">赤</option><option value="#555555">グレー</option><option value="#111111">黒</option></select></label>
<hr>
<label>パース種類<select id="pt"><option value="auto">おまかせ</option><option value="1">1点透視</option><option value="2">2点透視</option><option value="3">3点透視</option></select></label>
<label>背景の建物<select id="bkind"><option value="auto">おまかせ</option><option value="none">なし</option><option value="street">街並み・路地</option><option value="corner">角(コーナー)</option><option value="single">単体の建物</option><option value="cluster">ビル群・家々</option></select></label>
<label>建物の数<input type="range" id="bden" min="0" max="200" value="100"></label>
<label>建物の規模<input type="range" id="bscl" min="50" max="250" value="100"></label>
<label>地形<select id="terr"><option value="none">平地</option><option value="plat">段差・高台</option><option value="steps">階段</option><option value="rocks">岩場</option><option value="trees">並木</option></select></label>
<label>方位<input type="range" id="az" min="-180" max="180"></label>
<label>あおり/ふかん(目の高さ)<input type="range" id="el" min="-50" max="65"></label>
<label>横ずれ(消失点の位置)<input type="range" id="sx" min="-200" max="200"></label>
<label>パース強度<input type="range" id="pers" min="0" max="100"></label>
<label>傾き<input type="range" id="roll" min="-30" max="30"></label>
<hr><b>体の傾き(全員に加算)</b>
<label>前後の傾き<input type="range" id="tw_lean" min="-40" max="40" value="0"></label>
<label>横の傾き<input type="range" id="tw_side" min="-40" max="40" value="0"></label>
<label>胴のひねり<input type="range" id="tw_twist" min="-60" max="60" value="0"></label>
<label>腰の傾き<input type="range" id="tw_tilt" min="-30" max="30" value="0"></label>
<label>猫背/反り<input type="range" id="tw_bend" min="-40" max="40" value="0"></label>
<label>頭の傾き<input type="range" id="tw_head" min="-40" max="40" value="0"></label>
<div class="row"><button id="twrand">傾きランダム</button><button id="twreset">リセット</button></div>
<hr>
<label class="c"><input type="checkbox" id="vol" checked>塗り(裏の線を隠す)</label>
<label class="c"><input type="checkbox" id="bone" checked>骨格・肩腰ライン</label>
<label class="c"><input type="checkbox" id="joint" checked>関節点</label>
<label class="c"><input type="checkbox" id="guide" checked>構図ガイド</label>
<label class="c"><input type="checkbox" id="persp" checked>パース(グリッド/消失点/ホライゾン/収束線)</label>
<label class="c"><input type="checkbox" id="cog" checked>重心線・接地影</label>
<label class="c"><input type="checkbox" id="memo" checked>メモ文字を入れる</label>
<hr><b>動きを示す線</b>
<label class="c"><input type="checkbox" id="trail">軌跡(手足の動きの弧)</label>
<label class="c"><input type="checkbox" id="ghost">残像(前のコマ)</label>
<label class="c"><input type="checkbox" id="speed">スピード線(流線)</label>
<label class="c"><input type="checkbox" id="focus">集中線</label>
<label>動きの量<input type="range" id="mot" min="0" max="100" value="60"></label>
<button id="mrand">動き線おまかせ</button>
<label>線の太さ<input type="range" id="lwm" min="50" max="250" value="100"></label>
<hr>
<b>人物ごとの設定(最大10人)</b>
<label>人数(自由配置)<input type="range" id="nfree" min="1" max="10" value="4"></label>
<button id="mkfree">👥 自由配置で生成(各人独立)</button>
<div class="row" id="tabs" style="flex-wrap:wrap"></div>
<div id="pp" style="display:flex;flex-direction:column;gap:8px">
<label>ポーズ<select id="pp_pose"></select></label>
<label>X位置<input type="range" id="pp_x" min="-300" max="300"></label>
<label>奥行<input type="range" id="pp_z" min="-250" max="250"></label>
<label>向き<input type="range" id="pp_yaw" min="-180" max="180"></label>
<label>大きさ<input type="range" id="pp_sc" min="60" max="130"></label></div>
<small>ポーズ・位置は「自由配置」シーンのみ。服と持ち物は全シーンで使えます。</small>
<div class="row"><button id="clr">この人の服ランダム</button><button id="clra">全員の服ランダム</button></div>
<label class="c"><input type="checkbox" id="clon" checked>服を表示</label>
<label class="c"><input type="checkbox" id="iton" checked>持ち物を表示</label>
<label class="c"><input type="checkbox" id="lbl" checked>人物番号を表示(クリックで選択)</label>
<label class="c"><input type="checkbox" id="clrand" checked>生成時に服・持ち物もランダム</label>
<hr>
<label>シード<input type="text" id="seed" size="15"></label>
<small>シードを書き換えてEnterで再現できます。スライダーで視点を手動調整可。1点・2点透視は縦線が平行(シフトレンズ)、3点透視は縦線も消失点に収束します。</small>
</div>
<div id="main"><canvas id="cv"></canvas></div>
<script>

const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),D=Math.PI/180;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/(Math.hypot(...a)||1));
const Rx=a=>{const c=Math.cos(a),s=Math.sin(a);return[1,0,0,0,c,-s,0,s,c]},Ry=a=>{const c=Math.cos(a),s=Math.sin(a);return[c,0,s,0,1,0,-s,0,c]},Rz=a=>{const c=Math.cos(a),s=Math.sin(a);return[c,-s,0,s,c,0,0,0,1]};
const mm=(A,B)=>{const M=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)M.push(A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j]);return M};
const ap=(M,v)=>[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
const rod=(v,k,a)=>{k=norm(k);const c=Math.cos(a),s=Math.sin(a);return add(add(mul(v,c),mul(cross(k,v),s)),mul(k,dot(k,v)*(1-c)))};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ---------- ポーズ定義 (角度は度) ---------- */
const A2=f=>[0,1].map(i=>f(i));
const ARCH={
stand:{n:'立ち',g:R=>({lean:R(-4,6),bend:R(-6,10),twist:R(-20,20),side:R(-8,8),tilt:R(-8,8),arm:A2(()=>({f:R(-25,25),a:R(4,22),b:R(5,45),roll:R(-40,40)})),leg:A2(()=>({f:R(-10,15),a:R(3,10),b:R(0,15)})),jump:0})},
walk:{n:'歩き',g:R=>{const f=R(22,36),L=[{f,a:4,b:R(0,12)},{f:-R(14,24),a:4,b:R(8,28),ft:55}];if(R(0,1)<.5)L.reverse();return{lean:R(2,7),bend:R(0,8),twist:R(-18,18),side:R(-4,4),tilt:R(-5,5),leg:L,arm:A2(i=>({f:-L[i].f*.8+R(-5,5),a:R(3,9),b:R(15,45),roll:R(-20,20)})),jump:0}}},
run:{n:'走り',g:R=>{const L=[{f:R(50,80),a:R(3,8),b:R(50,90),ft:70},{f:-R(25,45),a:R(3,8),b:R(70,110),ft:40}];if(R(0,1)<.5)L.reverse();return{lean:R(8,20),bend:R(0,10),twist:R(-20,20),side:R(-5,5),tilt:R(-6,6),leg:L,arm:A2(i=>({f:Math.max(-60,Math.min(70,-L[i].f*.9)),a:R(5,15),b:R(70,100),roll:R(-20,20)})),jump:R(.05,.25)}}},
jump:{n:'ジャンプ',g:R=>({lean:R(-10,10),bend:R(-5,12),twist:R(-20,20),side:R(-8,8),tilt:R(-6,6),leg:A2(()=>({f:R(20,80),a:R(5,20),b:R(40,110),ft:R(40,70)})),arm:A2(()=>({f:R(20,150),a:R(20,110),b:R(5,50),roll:R(-40,40)})),jump:R(.3,.9)})},
crouch:{n:'しゃがみ',g:R=>({lean:R(10,30),bend:R(10,30),twist:R(-20,20),side:R(-6,6),tilt:R(-5,5),leg:A2(()=>({f:R(80,110),a:R(8,25),b:R(100,140),ft:75})),arm:A2(()=>({f:R(10,60),a:R(5,25),b:R(20,80),roll:R(-30,30)})),jump:0})},
kick:{n:'キック',g:R=>{const L=[{f:R(0,10),a:5,b:R(5,15)},{f:R(70,115),a:R(5,25),b:R(5,40)}];if(R(0,1)<.5)L.reverse();return{lean:R(-18,-6),bend:R(-5,8),twist:R(-30,30),side:R(-10,10),tilt:R(-8,8),leg:L,arm:A2(()=>({f:R(-30,30),a:R(35,85),b:R(10,50),roll:R(-30,30)})),jump:R(0,.1)}}},
reach:{n:'手を伸ばす',g:R=>{const ar=[{f:R(125,170),a:R(8,30),b:R(0,20),roll:0},{f:R(-10,40),a:R(20,50),b:R(20,50),roll:R(-30,30)}];if(R(0,1)<.5)ar.reverse();return{lean:R(-8,10),bend:R(-6,10),twist:R(-20,20),side:R(-15,15),tilt:R(-6,6),arm:ar,leg:[{f:R(-6,18),a:R(4,10),b:R(0,15)},{f:R(-12,5),a:R(4,10),b:R(0,15)}],jump:0}}},
sit:{n:'座り',g:R=>({lean:R(-5,12),bend:R(0,20),twist:R(-20,20),side:R(-6,6),tilt:R(-4,4),leg:A2(()=>({f:R(78,95),a:R(5,18),b:R(80,100)})),arm:A2(()=>({f:R(10,50),a:R(5,20),b:R(40,90),roll:R(-30,30)})),jump:0,seat:1})},
punch:{n:'パンチ',g:R=>{const sw=R(0,1)<.5,t=R(15,40)*(sw?1:-1),ar=[{f:R(70,100),a:R(5,15),b:R(0,15),roll:0},{f:R(20,50),a:R(15,30),b:R(100,130),roll:0}],lg=[{f:R(15,30),a:R(8,14),b:R(10,30)},{f:-R(10,25),a:R(8,14),b:R(10,30),ft:60}];if(sw){ar.reverse();lg.reverse()}return{lean:R(5,15),bend:R(0,10),twist:t,side:R(-6,6),tilt:R(-5,5),arm:ar,leg:lg,jump:0}}},
throw:{n:'投げる',g:R=>{const ar=[{f:-R(20,50),a:R(60,100),b:R(60,100),roll:R(-30,30)},{f:R(60,100),a:R(10,30),b:R(0,20),roll:0}],lg=[{f:R(25,40),a:R(6,12),b:R(10,30)},{f:-R(15,30),a:R(6,12),b:R(0,15),ft:60}];if(R(0,1)<.5){ar.reverse();lg.reverse()}return{lean:R(-8,6),bend:R(-5,8),twist:R(25,50)*(R(0,1)<.5?1:-1),side:R(-8,8),tilt:R(-5,5),arm:ar,leg:lg,jump:0}}},
lunge:{n:'踏み込み(ランジ)',g:R=>{const lg=[{f:R(70,90),a:R(5,12),b:R(80,100)},{f:-R(15,30),a:R(5,12),b:R(70,100)}];if(R(0,1)<.5)lg.reverse();return{lean:R(5,15),bend:R(0,12),twist:R(-15,15),side:R(-5,5),tilt:R(-4,4),leg:lg,arm:A2(()=>({f:R(-20,40),a:R(10,30),b:R(20,60),roll:R(-20,20)})),jump:0}}},
kneel:{n:'片膝立ち',g:R=>{const lg=[{f:R(85,95),a:R(5,10),b:R(85,95)},{f:R(-5,10),a:R(5,10),b:R(85,110)}];if(R(0,1)<.5)lg.reverse();return{lean:R(-2,12),bend:R(0,14),twist:R(-20,20),side:R(-5,5),tilt:R(-4,4),leg:lg,arm:A2(()=>({f:R(0,60),a:R(5,25),b:R(10,80),roll:R(-30,30)})),jump:0}}},
hero:{n:'仁王立ち(腰に手)',g:R=>({lean:R(-5,3),bend:R(-5,5),twist:R(-12,12),side:R(-4,4),tilt:R(-4,4),arm:A2(i=>({f:R(-10,20),a:R(35,55),b:R(100,130),roll:(i?1:-1)*R(70,100)})),leg:A2(()=>({f:R(-5,10),a:R(12,22),b:R(0,8)})),jump:0})},
wave:{n:'手を振る',g:R=>{const ar=[{f:R(0,30),a:R(70,100),b:R(70,110),roll:R(-20,20)},{f:R(-15,20),a:R(4,20),b:R(5,40),roll:R(-30,30)}];if(R(0,1)<.5)ar.reverse();return{lean:R(-3,5),bend:R(-5,8),twist:R(-15,15),side:R(-12,12),tilt:R(-8,8),arm:ar,leg:A2(()=>({f:R(-10,12),a:R(3,10),b:R(0,12)})),jump:0}}},
dance:{n:'ダンス(ひねり)',g:R=>{const lg=[{f:R(20,60),a:R(5,25),b:R(30,80)},{f:R(-5,10),a:R(5,10),b:R(0,10)}];if(R(0,1)<.5)lg.reverse();return{lean:R(-10,15),bend:R(-10,15),twist:R(-45,45),side:R(-20,20),tilt:R(-15,15),arm:A2(()=>({f:R(-20,60),a:R(40,130),b:R(10,70),roll:R(-40,40)})),leg:lg,jump:R(0,.1)}}},
fall:{n:'のけぞり/よろめき',g:R=>{const lg=[{f:R(15,30),a:R(5,12),b:R(5,25)},{f:-R(10,20),a:R(5,12),b:R(10,30),ft:60}];if(R(0,1)<.5)lg.reverse();return{lean:-R(15,30),bend:-R(5,15),twist:R(-15,15),side:R(-8,8),tilt:R(-6,6),arm:A2(()=>({f:R(-40,10),a:R(30,70),b:R(20,60),roll:R(-30,30)})),leg:lg,jump:0}}},
stretch:{n:'背伸び',g:R=>({lean:-R(0,8),bend:-R(0,10),twist:R(-10,10),side:R(-8,8),tilt:R(-4,4),arm:A2(()=>({f:R(150,175),a:R(5,30),b:R(0,15),roll:0})),leg:A2(()=>({f:R(-3,3),a:3,b:0})),jump:.02})}
};
for(const k in ARCH){const o=document.createElement('option');o.value=k;o.textContent=ARCH[k].n;$('ptype').appendChild(o)}

/* ---------- 3D骨格 (顔は +z 向き, y上) ---------- */
function build(p){
 const Rp=mm(Rx(p.lean*D),Rz(p.tilt*D)),Rc=mm(mm(mm(Rp,Rx(p.bend*D)),Ry(p.twist*D)),Rz(p.side*D)),Rh=mm(mm(mm(Rc,Rx(p.nod*D)),Ry(p.turn*D)),Rz(p.hz*D));
 const P={};P.pel=[0,1,0];P.waist=add(P.pel,ap(Rp,[0,.1,0]));P.nb=add(P.waist,ap(Rc,[0,.38,0]));
 P.nk=add(P.nb,ap(Rh,[0,.09,0]));P.head=add(P.nb,ap(Rh,[0,.19,0]));
 for(let i=0;i<2;i++){const s=i?1:-1,q=p.arm[i],l=p.leg[i];
  P['sh'+i]=add(P.nb,ap(Rc,[s*.19,-.04,0]));
  const u=norm(ap(Rc,ap(Rx(-q.f*D),ap(Rz(s*q.a*D),[0,-1,0]))));
  P['el'+i]=add(P['sh'+i],mul(u,.29));
  const fd=rod(u,rod(ap(Rc,[1,0,0]),u,q.roll*D),-q.b*D);
  P['wr'+i]=add(P['el'+i],mul(fd,.26));P['hd'+i]=add(P['wr'+i],mul(fd,.1));
  P['hp'+i]=add(P.pel,ap(Rp,[s*.09,-.05,0]));
  const t=norm(ap(Rp,ap(Rx(-l.f*D),ap(Rz(s*l.a*D),[0,-1,0]))));
  P['kn'+i]=add(P['hp'+i],mul(t,.42));
  const sh=rod(t,ap(Rp,[1,0,0]),l.b*D);
  P['an'+i]=add(P['kn'+i],mul(sh,.41));
  P['toe'+i]=add(P['an'+i],mul(rod(sh,ap(Rp,[1,0,0]),-(l.ft||80)*D),.2));
 }
 let mn=1e9;for(const k of['an0','an1','toe0','toe1'])mn=Math.min(mn,P[k][1]);mn=Math.min(mn,P.kn0[1]-.05,P.kn1[1]-.05);
 const dy=-mn+(p.jump||0);for(const k in P)P[k][1]+=dy;
 return{P,Rp,Rc,Rh};
}
const S={mot:.6,az:0,el:10,pers:.6,roll:0,cpi:0,shotA:'full',cmA:'third',ps:1,cs:1,pt:2,sx:0,chars:[],solids:[],hs:2,rad:1};
const both=(c,f)=>{f(c.p);f(c.alt);return c};

function xf(J,ch){const Y=Ry(ch.yaw*D),P={};

 if(S.post){const d=S.post(F);for(const i in d){const c=S.chars[i];c.off=d[i];for(const k in c.fr.P)c.fr.P[k]=add(c.fr.P[k],d[i])}}
 if(S.ikf)S.ikf(F).forEach(e=>{const ch=S.chars[e.c];ik2(ch,e.a,e.t,e.pl);ch.ikArms.push(e.a)});
 let mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9],rad=0;
 S.chars.forEach(c=>Object.values(c.fr.P).forEach(q=>{for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],q[i]);mx[i]=Math.max(mx[i],q[i])}rad=Math.max(rad,Math.hypot(q[0],q[2]))}));
 mx[1]+=.12;S.hs=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2],1.2);S.rad=rad+.3}

 let k=$('scn').value;

 const sc=SC[k].g(R,R2,t);S.chars=sc.ch;S.post=sc.post||null;S.ikf=sc.ik||null;S.sceneKey=k;S.sceneName=SC[k].n;
 const m=[0,0];S.chars.forEach(c=>{m[0]+=c.pos[0]/S.chars.length;m[1]+=c.pos[1]/S.chars.length});S.chars.forEach(c=>{c.pos=[c.pos[0]-m[0],c.pos[1]-m[1]]});

$('bkind').onchange=()=>{genScn(S.cs);render()};
$('asp').onchange=()=>{resize();render()};$('cw').onchange=$('chh').onchange=()=>{$('asp').value='custom';resize();render()};
['bden','bscl','terr'].forEach(i=>$(i).oninput=$(i).onchange=()=>{genScn(S.cs);render()});
$('pt').onchange=()=>{const v=$('pt').value;if(v==='auto'){genCam(rs());render();return}
 S.pt=+v;const snap=a=>[0,90,180,-90,-180].reduce((b,c)=>Math.abs(c-a)<Math.abs(b-a)?c:b);
 if(S.pt===1){S.az=snap(S.az);S.el=Math.max(-6,Math.min(22,S.el))}
 else if(S.pt===2){if(S.az%90===0)S.az+=30;S.el=Math.max(-6,Math.min(24,S.el))}
 else{if(Math.abs(S.el)<20)S.el=S.el<0?-25:35;S.sx=0}
 genScn(S.cs);sync();render()};
['comp','shot','col','vol','bone','joint','guide','persp','cog','memo','style','trail','ghost','speed','focus'].forEach(i=>$(i).onchange=render);
[['mot','mot',.01],['az','az',1],['el','el',1],['pers','pers',.01],['roll','roll',1],['sx','sx',.01]].forEach(([i,k,m])=>$(i).oninput=e=>{S[k]=+e.target.value*m;
 if(k==='az'&&S.pt===1&&S.az%90!==0){S.pt=2;$('pt').value='2'}
 render()});
$('seed').onkeydown=e=>{if(e.key==='Enter'){const m=$('seed').value.match(/\d+/g)||[];genPose(+m[0]||1);genCam(+m[1]||+m[0]||1);render()}};
document.onkeydown=e=>{if(e.target.tagName==='INPUT'&&(e.target.type==='text'||e.target.type==='number'))return;if(e.target.tagName==='SELECT')return;
 if(e.code==='Space'){e.preventDefault();all_()}else if(e.key==='p')$('gp').click();else if(e.key==='c')$('gc').click();else if(e.key==='s')$('save').click()};

/* ---------- 人物ごとの設定(服・持ち物・自由配置) ---------- */
S.sel=0;
const OPT={top:['なし','Tシャツ','長袖','ジャケット','パーカー','ロングコート'],bot:['なし','短パン','ズボン','スカート','ロングスカート'],hat:['なし','キャップ','つば広帽','ニット帽'],shoe:['なし','靴','ブーツ'],hold:['なし','傘','剣','杖','ボール','本','カップ','スマホ','買い物袋','ハンドバッグ','花束'],hand:['おまかせ','右手','左手'],back:['なし','リュック','ショルダーバッグ']},LB={top:'上着',bot:'下',hat:'帽子',shoe:'靴',hold:'持ち物(手)',hand:'持つ手',back:'背負い/掛け'};
const cfg=i=>(S.pc=S.pc||[])[i]||(S.pc[i]={pose:'random',top:0,bot:0,hat:0,shoe:0,hold:0,hand:0,back:0});
const rndCl=R=>{const o={},g=(k,p)=>o[k]=R(0,1)<p?0:1+Math.floor(R(0,1)*(OPT[k].length-1));g('top',.1);g('bot',.1);g('hat',.6);g('shoe',.3);g('hold',.5);o.hand=Math.floor(R(0,1)*3);g('back',.7);return o};
const spot=(R,n,pts)=>{let p,k=0;do{p=[R(-.5,.5)*(1.6+.5*n),R(-.5,.5)*(1.2+.35*n)];k++}while(k<60&&pts.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<.8));return p};
(()=>{const d=$('pp');for(const k in OPT){const l=document.createElement('label'),e=document.createElement('select');l.textContent=LB[k];e.id='pp_'+k;OPT[k].forEach((t,i)=>e.add(new Option(t,i)));e.onchange=()=>{cfg(S.sel)[k]=+e.value;render()};l.appendChild(e);d.appendChild(l)}
 $('pp_pose').add(new Option('おまかせ','random'));for(const k in ARCH)$('pp_pose').add(new Option(ARCH[k].n,k))})();
function pp(){const t=$('tabs');S.sel=Math.min(S.sel,S.chars.length-1);t.innerHTML='';
 S.chars.forEach((c,i)=>{const b=document.createElement('button');b.textContent=i+1;b.style.cssText='flex:0 0 34px;padding:4px'+(i===S.sel?';background:var(--ac);color:#fff':'');b.onclick=()=>{S.sel=i;pp();render()};t.appendChild(b)});
 const c=S.chars[S.sel],f=cfg(S.sel),fr=S.sceneKey==='free';for(const k in OPT)$('pp_'+k).value=f[k];
 $('pp_pose').value=fr?f.pose:c.type;$('pp_x').value=c.pos[0]*100;$('pp_z').value=c.pos[1]*100;$('pp_yaw').value=c.yaw;$('pp_sc').value=c.sc*100;
 ['pose','x','z','yaw','sc'].forEach(k=>$('pp_'+k).disabled=!fr)}
const ed=(id,f)=>$('pp_'+id).oninput=e=>{f(S.chars[S.sel],+e.target.value);layout();render()};
ed('x',(c,v)=>c.pos[0]=v/100);ed('z',(c,v)=>c.pos[1]=v/100);ed('yaw',(c,v)=>c.yaw=v);ed('sc',(c,v)=>c.sc=v/100);
const rnd=(a,b)=>a+(b-a)*Math.random(),rk=()=>{const ks=Object.keys(ARCH);return ks[Math.floor(Math.random()*ks.length)]};
$('pp_pose').onchange=e=>{const f=cfg(S.sel),c=S.chars[S.sel];f.pose=e.target.value;S.chars[S.sel]=mkc(f.pose==='random'?rk():f.pose,rnd,rnd,{pos:c.pos,yaw:c.yaw,sc:c.sc});layout();pp();render()};
$('nfree').oninput=()=>{if(S.sceneKey!=='free')return;const n=+$('nfree').value,ch=S.chars;ch.length=Math.min(ch.length,n);
 while(ch.length<n){const f=cfg(ch.length);ch.push(mkc(f.pose==='random'?rk():f.pose,rnd,rnd,{pos:spot(rnd,n,ch.map(c=>c.pos)),yaw:rnd(-60,60),sc:rnd(.9,1.08)}));if($('clrand').checked)Object.assign(f,rndCl(rnd))}
 layout();pp();render()};
$('mkfree').onclick=()=>{$('scn').value='free';genPose(rs());genScn(S.cs);sync();render()};
$('clr').onclick=()=>{Object.assign(cfg(S.sel),rndCl(rnd));pp();render()};
$('clra').onclick=()=>{S.chars.forEach((c,i)=>Object.assign(cfg(i),rndCl(rnd)));pp();render()};
['clon','iton','lbl'].forEach(i=>$(i).onchange=render);
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;let b=-1,d=1e9;(S.hp||[]).forEach((q,i)=>{const k=Math.hypot(q.x-x,q.y-y);if(k<d){d=k;b=i}});if(b>=0&&d<cv.width*.08){S.sel=b;pp();render()}};
resize();all_();
</script></body></html>
